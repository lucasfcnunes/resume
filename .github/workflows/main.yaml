name: CI
on:
  push:
  pull_request:
    branches:
      - master
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: cachix/install-nix-action@v31.10.6
      - name: Enable user namespaces for steam-run (bwrap)
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: nix develop --command -- task install
      - run: nix develop --command -- task build
      - run: nix develop --command -- task render-pdf
      - uses: peaceiris/actions-gh-pages@v4.0.0
        if: ${{ github.ref == 'refs/heads/master' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: resume.lucasfcnunes.com
